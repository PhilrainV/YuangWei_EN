name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r google_scholar_crawler/requirements.txt

      - name: Restore previous citation data
        run: |
          mkdir -p google_scholar_crawler/results
          base_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/google-scholar-stats"
          curl --fail --silent --show-error --location "${base_url}/gs_data.json"             --output google_scholar_crawler/results/gs_data.json || true
          curl --fail --silent --show-error --location "${base_url}/gs_data_shieldsio.json"             --output google_scholar_crawler/results/gs_data_shieldsio.json || true

      - name: Fetch and publish citation data
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          cd google_scholar_crawler
          timeout --signal=TERM --kill-after=30s 5m python main.py
          cd results

          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.json
          git commit -m "Updated Citation Data"
          git push "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"             HEAD:google-scholar-stats --force
