name: Format homepage assets

on:
  push:
    paths:
      - ".github/workflows/format-homepage-assets.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Format generated assets
        run: |
          npx --yes prettier@3.6.2 --write "$JS_ASSET" assets/index-BTSo520V.css
          node --check "$JS_ASSET"
        env:
          JS_ASSET: assets/index-CXODhpzZ.js

      - name: Commit formatted assets and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-homepage-assets.yml
          git add "$JS_ASSET" assets/index-BTSo520V.css
          git commit -m "Format compiled JavaScript and CSS assets"
          git push origin HEAD:master
        env:
          JS_ASSET: assets/index-CXODhpzZ.js
