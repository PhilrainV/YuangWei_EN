name: Build academic homepage

on:
  push:
    branches:
      - master
    paths:
      - "homepage-source/**"
      - ".github/workflows/split-homepage-content.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homepage-source/package-lock.json

      - name: Build homepage
        working-directory: homepage-source
        run: |
          mkdir -p public/content
          cp ../content/*.js public/content/
          npm ci
          npm run build

      - name: Replace browser assets
        run: |
          rm -f assets/*.js
          cp homepage-source/dist/assets/*.js assets/
          cp homepage-source/dist/index.html index.html
          npx --yes prettier@3.6.2 --write assets/*.js
          for file in assets/*.js; do node --check "$file"; done

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git commit -m "Build homepage from maintainable source [skip ci]"
          git push origin HEAD:master
